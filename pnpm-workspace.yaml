allowBuilds:
  "@google/genai": false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - "@agntn/*"

catalogs:
  deps:
    "@agntn/tools": 0.3.1
    "@modelcontextprotocol/server": 2.2.0
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.5.2
    "@modelcontextprotocol/client": 2.2.0
    "@oh-my-pi/pi-coding-agent": 18.0.0
    "@types/node": 26.2.0
    ai: 7.0.173
    obuild: 0.4.45
    typescript: 7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
    vite-plus: 1.7.0

cleanupUnusedCatalogs: true

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore

overrides:
  vite@*: catalog:dev
